<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dlicom Space Run</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#e8f0ff;--acc:#39c5ff;--gold:#ffc83d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#070b1f;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:rgba(10,18,50,.9);border:1px solid rgba(57,197,255,.45);border-radius:18px;padding:20px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 40px rgba(57,197,255,.25);margin:auto}
h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
h1 span{color:var(--acc)}
p{margin:6px 0;font-size:13.5px;line-height:1.4;color:#b9c8ee}
.good b{color:var(--gold)} .bad b{color:#ff6b7a}
button{margin-top:12px;background:linear-gradient(135deg,#39c5ff,#7a5cff);color:#fff;border:0;border-radius:12px;padding:12px 30px;font-size:17px;font-weight:700;cursor:pointer}
.lb{margin-top:10px;font-size:12.5px;color:#b9c8ee;text-align:left}
.lb div{display:flex;justify-content:space-between;padding:2px 8px}
.lb div:first-child{color:var(--gold);font-weight:700}
.miss{margin-top:10px;font-size:12.5px;text-align:left;background:rgba(57,197,255,.08);border:1px solid rgba(57,197,255,.25);border-radius:10px;padding:8px 10px}
.miss div{padding:2px 0;color:#cfe0ff}
.miss div.done{color:#3fe0a0;text-decoration:line-through;opacity:.8}
.hide{display:none!important}
.best{color:var(--gold);font-weight:700}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas><div id="ov"><div class="card" id="card"></div></div></div>

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),card=document.getElementById('card');
const img=new Image();let imgOk=false;img.onload=()=>imgOk=true;img.src=MASCOT;
let W=0,H=0,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();

const BAD=[['🕵️','Scammer'],['🤖','Bot'],['🎣','Phishing link'],['📉','Market crash'],['👛','Fake wallet']];
const POWER={shield:{icon:'🛡️',label:'SHIELD',col:'#39c5ff'},hyper:{icon:'⚡',label:'HYPERDRIVE',col:'#ff9d3d',dur:7},magnet:{icon:'🧲',label:'MAGNET',col:'#b96bff',dur:8},slow:{icon:'⏳',label:'SLOW-MO',col:'#3fe0a0',dur:6},double:{icon:'✖️2',label:'DOUBLE SCORE',col:'#ffc83d',dur:8}};
const STAGES=[{name:'Easy',spd:1,spawn:1,bad:.36},{name:'Normal',spd:1.15,spawn:1.12,bad:.38},{name:'Fast',spd:1.35,spawn:1.28,bad:.42},{name:'Extreme',spd:1.55,spawn:1.48,bad:.46},{name:'Dlicom Hyperdrive',spd:1.8,spawn:1.6,bad:.56}];
const CYCLE_STEP=1500,BASE_SPEED=300;
const MPOOL=[
 {id:'surv',d:'Survive 60 seconds',chk:s=>s.timeAlive>=60,p:()=>s.timeAlive},
 {id:'coin',d:'Collect 15 $DLI coins',chk:s=>s.dli>=15,p:s=>s.dli},
 {id:'logo',d:'Collect 2 Dlicom Logos',chk:s=>s.logo>=2,p:s=>s.logo},
 {id:'dodge',d:'Dodge 10 obstacles',chk:s=>s.dodged>=10,p:s=>s.dodged},
 {id:'score',d:'Reach a score of 3,000',chk:s=>s.scoreAcc>=3000,p:s=>Math.floor(s.scoreAcc)},
 {id:'combo',d:'Reach a 10x combo streak',chk:s=>s.maxStreak>=10,p:s=>s.maxStreak},
 {id:'usdt',d:'Collect 1 USDT',chk:s=>s.usdt>=1,p:s=>s.usdt},
 {id:'noshield',d:'Finish a run without a shield pickup',chk:s=>!s.shieldUsed&&s.timeAlive>20,p:()=>''},
];
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.9+.1}));
let st='menu',items=[],pops=[],parts=[],spawn=0,inv=0,hold=false,t0=0,flash=0,toast=null;
let spdMultCur=1,spdMultTgt=1,spwMultCur=1,spwMultTgt=1,stageIdx=0;
const P={x:0,y:0,vy:0,r:26};
let S={dist:0,dli:0,usdt:0,logo:0,comm:0,dodged:0,lives:3,scoreAcc:0,streak:0,maxStreak:0,shieldUsed:false,timeAlive:0,power:null};
let missions=[];

function bestScore(){try{return +localStorage.getItem('dlicom-best-score')||0}catch(e){return 0}}
function saveBest(v){try{if(v>bestScore())localStorage.setItem('dlicom-best-score',v)}catch(e){}}
function today(){return 'dlicom-run-'+new Date().toISOString().slice(0,10)}
function board(){try{return JSON.parse(localStorage.getItem(today()))||[]}catch(e){return[]}}
function saveScore(v){try{const b=board();b.push(v);b.sort((a,c)=>c-a);localStorage.setItem(today(),JSON.stringify(b.slice(0,5)))}catch(e){}}
function lbHtml(){const b=board();if(!b.length)return '';return '<div class="lb"><p style="text-align:center;margin:0 0 4px">🏆 Today\'s top runs (this device)</p>'+b.map((s,i)=>`<div><span>#${i+1}</span><span>${s.toLocaleString()}</span></div>`).join('')+'</div>'}
function pickMissions(){const pool=[...MPOOL];const out=[];for(let i=0;i<3;i++){const idx=Math.floor(Math.random()*pool.length);out.push({...pool.splice(idx,1)[0]})}return out}
function missHtml(done){return '<div class="miss"><div style="color:var(--acc);font-weight:700">🎯 Missions'+(done?'':' (this run)')+'</div>'+missions.map(m=>`<div class="${m.chk(S)?'done':''}">${m.chk(S)?'✅':'▫️'} ${m.d}</div>`).join('')+'</div>'}
function mult(){return Math.min(1+Math.floor(S.streak/3)*0.5,5)}
function speed(){return BASE_SPEED*spdMultCur*(S.power&&S.power.type==='slow'?0.55:1)}
function stageFor(sc){return Math.floor(sc/CYCLE_STEP)%STAGES.length}

function menu(over){
  const b=bestScore();
  card.innerHTML=over
   ?`<h1>Run over 💥</h1><p>Score</p><h1 style="color:var(--gold)">${Math.floor(S.scoreAcc).toLocaleString()}</h1>${S.scoreAcc>=b-1&&S.scoreAcc>0?'<p class="best">🏆 New Best!</p>':`<p>Best: <span class="best">${b.toLocaleString()}</span></p>`}<p>🪙 ${S.dli} &nbsp; Đ ${S.logo} &nbsp; 💎 ${S.usdt} &nbsp; ❤️ ${S.comm} &nbsp; 📏 ${Math.floor(S.dist/10)}m</p>${missHtml(true)}${lbHtml()}<button id="go">Run again</button>`
   :`<h1>🚀 Dlicom <span>Space Run</span></h1><p>Hold <b>tap / Space / ↑</b> to fly up, release to drop.</p><p class="good">Collect <b>$DLI</b> 🪙 · <b>Dlicom Logo</b> Đ · <b>USDT</b> 💎 · <b>Community</b> ❤️ · power-ups</p><p class="bad">Dodge <b>scammers, bots, phishing, crashes, fake wallets</b>. Difficulty ramps up through 5 stages!</p><p>Best: <span class="best">${b.toLocaleString()}</span></p>${(function(){missions=pickMissions();return missHtml(false)})()}${lbHtml()}<button id="go">Launch</button>`;
  ov.classList.remove('hide');
  document.getElementById('go').onpointerdown=e=>{e.stopPropagation()};
  document.getElementById('go').onclick=start;
}
function start(){
  st='play';items=[];pops=[];parts=[];spawn=.6;inv=0;flash=0;toast=null;spdMultCur=spdMultTgt=1;spwMultCur=spwMultTgt=1;stageIdx=0;
  S={dist:0,dli:0,usdt:0,logo:0,comm:0,dodged:0,lives:3,scoreAcc:0,streak:0,maxStreak:0,shieldUsed:false,timeAlive:0,power:null};
  P.x=Math.min(140,W*.22);P.y=H/2;P.vy=0;ov.classList.add('hide');
}
function end(){
  S.scoreAcc+=missions.filter(m=>m.chk(S)).length*150;
  const v=Math.floor(S.scoreAcc);saveScore(v);saveBest(v);st='over';menu(true);
}

function add(k,x,y,extra){items.push(Object.assign({k,x,y,r:18},extra))}
let badZone=0;
function zoneY(){
  // cycle low/mid/high so obstacles reliably reach every vertical band, including low where the player can dive to
  const bands=[[H*0.62,H-40],[H*0.31,H*0.69],[40,H*0.38]];
  const b=bands[badZone%3];badZone++;
  return b[0]+Math.random()*(b[1]-b[0]);
}
function doSpawn(){
  const x=W+50,r=Math.random(),badProb=STAGES[stageIdx].bad;
  if(r<badProb){const b=BAD[Math.floor(Math.random()*BAD.length)];add('bad',x,zoneY(),{r:24,e:b[0],n:b[1]})}
  else{
    const y=60+Math.random()*(H-120),r2=(r-badProb)/(1-badProb);
    if(r2<.44){const n=1+Math.floor(Math.random()*4);for(let i=0;i<n;i++)add('coin',x+i*42,y+Math.sin(i)*18)}
    else if(r2<.60)add('usdt',x,y);
    else if(r2<.78)add('logo',x,y);
    else if(r2<.92){const keys=Object.keys(POWER);add('power',x,y,{pt:keys[Math.floor(Math.random()*keys.length)]})}
    else add('heart',x,y);
  }
}
function pop(x,y,txt,col){pops.push({x,y,txt,col,l:1})}
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,l:1,col})}
function award(base,label,x,y,col){const m=mult(),d=S.power&&S.power.type==='double'?2:1,pts=Math.round(base*m*d);S.scoreAcc+=pts;pop(x,y,'+'+pts+(m>1?' x'+m:'')+(d>1?' x2':''),col)}

function update(dt){
  const sp=speed();S.dist+=sp*dt;S.timeAlive+=dt;S.scoreAcc+=sp*dt*0.1;
  P.vy+=(hold?-2400:1500)*dt;P.vy=Math.max(-430,Math.min(520,P.vy));P.y+=P.vy*dt;
  if(P.y<P.r+8){P.y=P.r+8;P.vy=0}if(P.y>H-P.r-8){P.y=H-P.r-8;P.vy=0}
  inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt*1.6);
  if(toast)toast.l-=dt*0.6; if(toast&&toast.l<=0)toast=null;
  if(S.power){S.power.t-=dt;if(S.power.t<=0&&S.power.type!=='shield')S.power=null}

  const ns=stageFor(S.scoreAcc);
  if(ns!==stageIdx){stageIdx=ns;spdMultTgt=STAGES[ns].spd;spwMultTgt=STAGES[ns].spawn;
    toast={text:(ns===4?'⚡ DIFFICULTY: DLICOM HYPERDRIVE ⚡':'STAGE '+(ns+1)+': '+STAGES[ns].name),l:2.6,big:ns===4};
    if(ns===4)flash=1;
  }
  spdMultCur+=(spdMultTgt-spdMultCur)*dt*1.5;spwMultCur+=(spwMultTgt-spwMultCur)*dt*1.5;

  spawn-=dt;if(spawn<=0){doSpawn();spawn=(0.68+Math.random()*.35)/spwMultCur;}
  if(hold&&Math.random()<.7)parts.push({x:P.x-22,y:P.y+30,vx:-120-Math.random()*80,vy:60+Math.random()*60,l:.6,col:'#39c5ff'});

  for(const it of items){
    it.x-=sp*dt;
    if(S.power&&S.power.type==='magnet'&&(it.k==='coin'||it.k==='logo'||it.k==='usdt'||it.k==='heart')){
      const dx=P.x-it.x,dy=P.y-it.y,d=Math.hypot(dx,dy);
      if(d<230&&d>1){it.x+=dx/d*420*dt;it.y+=dy/d*420*dt}
    }
    const dx=it.x-P.x,dy=it.y-P.y,rr=(it.k==='bad'?it.r*.75:it.r)+P.r*(it.k==='bad'?.8:1);
    if(!it.d&&dx*dx+dy*dy<rr*rr){
      it.d=1;
      if(it.k==='coin'){S.dli++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);award(10,'DLI',it.x,it.y,'#ffc83d');burst(it.x,it.y,'#ffc83d',6)}
      else if(it.k==='usdt'){S.usdt++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);award(40,'USDT',it.x,it.y,'#3fe0a0');burst(it.x,it.y,'#3fe0a0',9)}
      else if(it.k==='logo'){S.logo++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);award(100,'LOGO',it.x,it.y,'#39c5ff');burst(it.x,it.y,'#39c5ff',12)}
      else if(it.k==='heart'){S.comm++;if(S.lives<3)S.lives++;S.scoreAcc+=50;pop(it.x,it.y,'+50 ❤️','#ff7ab0');burst(it.x,it.y,'#ff7ab0',10)}
      else if(it.k==='power'){S.power={type:it.pt,t:POWER[it.pt].dur||99};if(it.pt==='shield')S.shieldUsed=true;toast={text:POWER[it.pt].icon+' '+POWER[it.pt].label+' ACTIVATED',l:1.8};pop(it.x,it.y,POWER[it.pt].label,POWER[it.pt].col);burst(it.x,it.y,POWER[it.pt].col,10)}
      else if(it.k==='bad'){
        if(S.power&&S.power.type==='shield'){S.power=null;pop(it.x,it.y-20,'SHIELD BLOCKED!','#39c5ff');burst(it.x,it.y,'#39c5ff',14)}
        else if(inv<=0){S.lives--;S.streak=0;inv=1.6;pop(it.x,it.y-20,it.n+'!','#ff6b7a');burst(it.x,it.y,'#ff4d5e',14);if(S.lives<=0){end();return}}
        else it.d=0;
      }
    }
  }
  items.forEach(i=>{if(!i.d&&i.k==='bad'&&i.x<=-60)S.dodged++});
  items=items.filter(i=>!i.d&&i.x>-60);

  pops.forEach(p=>{p.y-=40*dt;p.l-=dt*1.1});pops=pops.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.6});parts=parts.filter(p=>p.l>0);
}

function drawItem(it,t){
  ctx.save();ctx.translate(it.x,it.y+Math.sin(t*3+it.x*.02)*3);
  if(it.k==='coin'){ctx.shadowColor='#ffc83d';ctx.shadowBlur=14;ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#b8860b';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#7a5200';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('D',0,1)}
  else if(it.k==='logo'){ctx.shadowColor='#39c5ff';ctx.shadowBlur=20;ctx.fillStyle='#16203f';ctx.strokeStyle='#39c5ff';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*6.283-1.57,x=Math.cos(a)*19,y=Math.sin(a)*19;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#39c5ff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Đ',0,1)}
  else if(it.k==='usdt'){ctx.shadowColor='#3fe0a0';ctx.shadowBlur=16;ctx.fillStyle='#26c485';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(18,0);ctx.lineTo(0,20);ctx.lineTo(-18,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₮',0,1)}
  else if(it.k==='heart'){ctx.shadowColor='#ff7ab0';ctx.shadowBlur=18;ctx.font='32px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('❤️',0,0)}
  else if(it.k==='power'){const p=POWER[it.pt];ctx.shadowColor=p.col;ctx.shadowBlur=20;ctx.fillStyle=p.col+'33';ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.font='20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.icon,0,1)}
  else{ctx.shadowColor='#ff2d4a';ctx.shadowBlur=22;ctx.strokeStyle='#ff4d5e';ctx.lineWidth=3;ctx.fillStyle='rgba(255,45,74,.22)';ctx.beginPath();ctx.arc(0,0,27,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.font='32px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.e,0,2)}
  ctx.restore();
}

function draw(t,dt){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(stageIdx===4){g.addColorStop(0,'#1a0633');g.addColorStop(1,'#3a0a4a')}else{g.addColorStop(0,'#04061a');g.addColorStop(1,'#141a4a')}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sp=st==='play'?speed():120;
  const neb=ctx.createRadialGradient(W*.75,H*.3,10,W*.75,H*.3,W*.5);neb.addColorStop(0,'rgba(122,92,255,.28)');neb.addColorStop(1,'rgba(122,92,255,0)');ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
  for(const s of stars){s.x-=sp*s.z*dt/W*.6;if(s.x<0)s.x+=1;ctx.globalAlpha=.3+s.z*.7;ctx.fillStyle='#fff';const l=st==='play'?s.z*sp/160:0;ctx.fillRect(s.x*W,s.y*H,1+s.z*1.5+l,1+s.z*1.2)}
  ctx.globalAlpha=1;
  items.forEach(i=>drawItem(i,t));
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
  if(st!=='over'){
    const bob=st==='play'?0:Math.sin(t*2)*8,px=st==='play'?P.x:Math.min(140,W*.22),py=st==='play'?P.y:H/2+bob;
    ctx.save();ctx.translate(px,py);ctx.rotate(st==='play'?P.vy/1400:0);
    if(inv>0&&Math.floor(t*14)%2)ctx.globalAlpha=.35;
    if(S.power&&S.power.type==='shield'){ctx.strokeStyle='#39c5ff';ctx.lineWidth=3;ctx.shadowColor='#39c5ff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,40,0,7);ctx.stroke()}
    ctx.shadowColor=stageIdx===4?'#ff9d3d':'#39c5ff';ctx.shadowBlur=24;
    if(imgOk){ctx.globalCompositeOperation='screen';const h=88,w=h*img.width/img.height;ctx.drawImage(img,-w/2,-h/2,w,h)}
    else{ctx.fillStyle='#39c5ff';ctx.beginPath();ctx.arc(0,0,P.r,0,7);ctx.fill()}
    ctx.restore();
  }
  pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.fillStyle=p.col;ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y)});ctx.globalAlpha=1;
  if(st==='play'){
    ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.fillText(Math.floor(S.scoreAcc).toLocaleString(),16,14);
    ctx.font='15px system-ui';ctx.fillStyle='#ffc83d';ctx.fillText('🪙'+S.dli,16,48);ctx.fillStyle='#39c5ff';ctx.fillText('Đ'+S.logo,66,48);ctx.fillStyle='#3fe0a0';ctx.fillText('💎'+S.usdt,106,48);ctx.fillStyle='#ff7ab0';ctx.fillText('❤️'+S.comm,146,48);
    if(S.streak>=3){ctx.fillStyle=mult()>=3?'#ff9d3d':'#ffc83d';ctx.font='bold 14px system-ui';ctx.fillText('COMBO x'+mult()+' ('+S.streak+')',16,70)}
    ctx.textAlign='right';ctx.font='22px serif';ctx.fillText('❤️'.repeat(Math.max(0,S.lives))+'🖤'.repeat(3-Math.max(0,S.lives)),W-16,14);
    ctx.font='13px system-ui';ctx.fillStyle='#8fa6d8';ctx.fillText(STAGES[stageIdx].name+' · '+Math.round(speed()/3)+' km/s',W-16,46);
    if(S.power){const p=POWER[S.power.type];ctx.textAlign='center';ctx.font='15px system-ui';ctx.fillStyle=p.col;const label=S.power.type==='shield'?p.icon+' READY':p.icon+' '+Math.ceil(S.power.t)+'s';ctx.fillText(label,W/2,16)}
  }
  if(toast){ctx.globalAlpha=Math.min(1,toast.l);ctx.textAlign='center';ctx.font=(toast.big?'bold 30px':'bold 20px')+' system-ui';ctx.fillStyle=toast.big?'#ff9d3d':'#39c5ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;ctx.fillText(toast.text,W/2,toast.big?H*.32:H*.18);ctx.shadowBlur=0;ctx.globalAlpha=1}
  if(flash>0){ctx.globalAlpha=flash*0.5;ctx.fillStyle='#ff9d3d';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

function loop(ts){
  const t=ts/1000,dt=Math.min(.033,t-t0||.016);t0=t;
  if(st==='play')update(dt);draw(t,dt);requestAnimationFrame(loop);
}
const down=()=>{hold=true},up=()=>{hold=false};
addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')down()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(st!=='play'&&!e.repeat&&ov.querySelector('button'))start();down()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))up()});
menu(false);requestAnimationFrame(loop);
</script></body></html>
